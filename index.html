<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oldagram</title>
    <link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">


</head>
<body>
    
        <div class="container">
            <header>
            <div class="oldagram">
        <h1>Oldagram</h1>
        <img src="Reign1.jpeg" alt="Reign Profile Pic" class="profile-pic">
        </div>
        </header>

        <main>
            <section>
        <div class="smaller-container">
        <img src="avatar-vangogh.jpg" alt="poster" class="user-info">
        
        <div class="name-detail">
       <span><h3 class="vincent">Vincent Van Gogh</h3></span>
    <span><p class="zudert">Zudert, Netherlands</p></span>
        
    </div>
    </div>

    <div>
        <img src="post-vangogh.jpg" alt="Victor Van gogh" class="post">
    </div>

    <div class="interaction-icon">
    <img src="icon-heart.png" alt="like-button" class="like-btn">
    <img src="icon-comment.png" alt="comment-button" class="comment-btn">
    <img src="icon-dm.png" alt="DM-button" class="dm-btn">
    </div>
        
    <div class="likes-class">
        <p class="likes">100,000.4 likes</p>
        <p class="reign">Reign <span class="art">Do not cut your Ears!</span></p>
    </div>
    </section>

    <section>
        
            <div class="smaller-container">
                <img src="avatar-courbet.jpg" alt="Profile pic of courbet" class="user-info">
                <div class="name-detail">
                     <span><h3 class="vincent">Gustave Courbet</h3></span>
                 <span><p class="zudert">Ornans, France</p></span>
      
                </div>
            </div>
        
        <div> 
            <img src="post-courbet.jpg" alt="courbet" class="post">
        </div>
        <div class="interaction-icon">
        <img src="icon-heart.png" alt="like-button" class="like-btn">
        <img src="icon-comment.png" alt="comment-button" class="comment-btn">
        <img src="icon-dm.png" alt="Dm-button" class="dm-btn">
        </div>

        <div class="likes-class">
            <p class="likes"> 53,003 likes</p>
            <p class="reign">Gustave <span class="art"> King of Selfies</span></p>
        </div>
    </section>

    <section>
        <div class="smaller-container">
            <img src="avatar-ducreux.jpg" alt="profile pic of ducreux" class="user-info">
            <div class="name-detail">
                <span><h3 class="vincent">Joseph Ducreux</h3></span>
                <span><p class="zudert">Paris, France</p></span>
            </div>
        </div>

        <div>
            <img src="post-ducreux.jpg" alt=" A post of ducreux" class="post">
        </div>

        <div class="Interaction-icon">
        <img src="icon-heart.png" alt="like-button" class="like-btn">
        <img src="icon-comment.png" alt="comment-button" class="comment-btn">
        <img src="icon-dm.png" alt="Dm-button" class="dm-btn">
        </div>
        

        <div class="likes-class ducreux">
            <p class="likes"> 74,003 likes</p>
            <p class="reign">Ducreux <span class="art">King of Archaic Rap</span></p>
        </div>

    </section>

</main>

</div>

        

    <script src="index.js"></script>
</body>
</html>
